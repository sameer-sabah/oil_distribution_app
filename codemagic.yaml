workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub upgrade --major-versions firebase_core firebase_auth firebase_storage cloud_firestore firebase_messaging firebase_database
          flutter pub get
          flutter gen-l10n || true
          flutter build ios --config-only --no-codesign
      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
