name: oil_distribution_app
description: "نافذة المنتوج النفطي"
publish_to: "none"

version: 2.0.4+15

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  http: ^1.2.2
  shared_preferences: ^2.5.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ===========================
  # Firebase
  # ===========================
  firebase_core: 4.15.1
  firebase_auth: 6.7.0
  firebase_database: 12.6.0
  cloud_firestore: 6.10.0
  cloud_functions: 6.5.1
  firebase_messaging: 16.7.0
  firebase_storage: 13.6.0

  # ===========================
  # Ads
  # ===========================
  google_mobile_ads: ^5.2.0

  # ===========================
  # State Management
  # ===========================
  provider: ^6.1.5

  # ===========================
  # Utilities
  # ===========================
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1

  # ===========================
  # File Picker & Images
  # ===========================
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  open_filex: ^4.7.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  nfc_manager: ^4.1.0
  gal: ^2.3.0

  # ===========================
  # Charts
  # ===========================
  fl_chart: ^0.69.0

  # ===========================
  # Maps
  # ===========================
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  flutter_polyline_points: ^2.1.0

  # ===========================
  # Links
  # ===========================
  url_launcher: ^6.3.1

  # ===========================
  # Permissions
  # ===========================
  permission_handler: ^11.3.1

  # ===========================
  # UI & Animation
  # ===========================
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  lottie: 3.3.0
  flutter_local_notifications: ^22.3.0
  pdf: 3.12.0
  printing: 5.14.3
  share_plus: 12.0.2
  path_provider: 2.1.6
  cross_file: 0.3.5+4
  excel: 4.0.6
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/