name: oil_distribution_app
description: "نافذة المنتوج النفطي"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ===========================
  # Firebase
  # ===========================
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_database: ^12.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.0.0

  # ===========================
  # State Management
  # ===========================
  provider: ^6.1.5

  # ===========================
  # Utilities
  # ===========================
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1

  # ===========================
  # File Picker & Images
  # ===========================
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  open_filex: ^4.7.0

  # ===========================
  # Charts
  # ===========================
  fl_chart: ^0.69.0

  # ===========================
  # Maps
  # ===========================
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  flutter_polyline_points: ^2.1.0

  # ===========================
  # Links
  # ===========================
  url_launcher: ^6.3.1

  # ===========================
  # Permissions
  # ===========================
  permission_handler: ^11.3.1

  # ===========================
  # UI & Animation
  # ===========================
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  flutter_local_notifications: ^22.3.0

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/